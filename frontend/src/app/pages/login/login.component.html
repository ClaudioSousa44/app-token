<main class="auth-page">
  <section class="auth-panel" aria-labelledby="login-title">
    <h1 id="login-title">Entrar</h1>
    <p>Acesse sua conta para continuar.</p>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" formControlName="email">
        <small *ngIf="loginForm.controls.email.touched && loginForm.controls.email.invalid">
          Informe um e-mail valido.
        </small>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" formControlName="password">
        <small *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
          Informe sua senha.
        </small>
      </div>

      <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="primary-button" type="submit" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="auth-switch">
      Ainda nao tem conta?
      <a routerLink="/cadastro">Criar cadastro</a>
    </p>
  </section>
</main>
