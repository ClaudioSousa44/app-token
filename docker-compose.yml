services:
  postgres:
    image: postgres:16-alpine
    container_name: app-token-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_token
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  postgres_data:

